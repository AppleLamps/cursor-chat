name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The rate-limit Lua scripts are tested against a real Redis; without the
      # binary those tests are skipped.
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Any value works for a build; production deployments set a real secret.
          ASKCURSOR_AGENT_SESSION_SECRET: ci-build-only

  # Separate job so a new advisory in a dependency shows up without blocking
  # unrelated work; it fails only for high and critical production advisories.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm audit --omit=dev --audit-level=high
